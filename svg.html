<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="static/css/svg.css" />
    <link rel="shortcut icon" href="static/img/favicon.ico">
    <title>ДЗ 13.1. Мистецтво SVG: фігури та анімація</title>
</head>
<body>
    <h1>SVG фігури</h1>
<div class="shapes">
    <svg class="svg-box" width="120" height="120" viewBox="0 0 120 120">
        <rect class="shape square" x="20" y="20" width="80" height="80" />
    </svg>
    <svg class="svg-box" width="160" height="120" viewBox="0 0 160 120">
        <rect class="shape rect" x="20" y="20" width="120" height="80" />
    </svg>
    <svg class="svg-box" width="120" height="120" viewBox="0 0 120 120">
        <circle class="shape circle" cx="60" cy="60" r="40" />
    </svg>
    <svg class="svg-box" width="160" height="120" viewBox="0 0 160 120">
        <ellipse class="shape ellipse animate-color" cx="80" cy="60" rx="60" ry="40" />
    </svg>
</div>
    <script src="static/js/main.js"></script>
</body>
</html>
